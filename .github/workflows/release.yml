name: Build and release
on:
  push:
    tags:
      - "v*.*.*"

permissions:
  contents: write

jobs:
  build:
    name: Build (${{ matrix.target }})
    runs-on: ${{ matrix.os }}

    strategy:
      matrix:
        include:
          #- target: x86_64-pc-windows-msvc
          #  os: windows-latest
          #  filename: gdpatch_loader.dll

          - target: x86_64-pc-windows-gnu
            os: ubuntu-latest
            filename: gdpatch_loader.dll

          - target: x86_64-unknown-linux-gnu
            os: ubuntu-latest
            filename: libgdpatch_loader.so

          - target: aarch64-apple-darwin
            os: macos-latest
            filename: libgdpatch_loader.dylib

          #- target: x86_64-apple-darwin
          #  os: macos-latest
          #  filename: libgdpatch_loader.dylib

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Install Rust
        uses: dtolnay/rust-toolchain@nightly
        with:
          toolchain: nightly-2026-08-01
          targets: ${{ matrix.target }}
      - name: Setup cache
        uses: Swatinem/rust-cache@v2

      - name: Set up MinGW
        if: matrix.target == 'x86_64-pc-windows-gnu'
        run: sudo apt-get install --yes --no-install-recommends gcc-mingw-w64-x86-64-win32

      - name: Build
        run: cargo build --package gdpatch-loader --release --target ${{ matrix.target }}
      - name: Upload artifact
        uses: actions/upload-artifact@v7
        with:
          name: gdpatch-${{ matrix.target }}
          path: target/${{ matrix.target }}/release/${{ matrix.filename }}

  release:
    name: Release
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Checkout
        uses: actions/checkout@v6
      - name: Download artifacts
        uses: actions/download-artifact@v8
        with:
          path: dist
          pattern: gdpatch-*
          merge-multiple: true
      - name: Print changelog
        run: |
          git tag --list --format='%(contents:body)' ${{ github.ref_name }} > ${{ github.workspace }}-CHANGELOG.md
          sed -i -z 's/^\s*//; s/\s*$//' ${{ github.workspace }}-CHANGELOG.md
      - name: Release
        uses: softprops/action-gh-release@v3
        with:
          body_path: ${{ github.workspace }}-CHANGELOG.md
          working_directory: dist
          files: "*.*"
