# TODO: create a release?
name: Build
#on: [push, pull_request]
on:
  push:
    tags:
      - "v*"

jobs:
  build:
    name: Build (${{ matrix.target }})
    runs-on: ${{ matrix.os }}

    strategy:
      fail-fast: false
      matrix:
        include:
          #- target: x86_64-pc-windows-msvc
          #  os: windows-latest
          #  filename: gdpatch_loader.dll

          - target: x86_64-pc-windows-gnu
            os: ubuntu-latest
            filename: gdpatch_loader.dll

          - target: x86_64-unknown-linux-gnu
            os: ubuntu-latest
            filename: libgdpatch_loader.so

          - target: aarch64-apple-darwin
            os: macos-latest
            filename: libgdpatch_loader.dylib

          #- target: x86_64-apple-darwin
          #  os: macos-latest
          #  filename: libgdpatch_loader.dylib

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Install Rust
        uses: dtolnay/rust-toolchain@nightly
        with:
          toolchain: nightly-2026-08-01
          targets: ${{ matrix.target }}
      - name: Setup cache
        uses: Swatinem/rust-cache@v2

      - name: Set up MinGW
        if: matrix.target == 'x86_64-pc-windows-gnu'
        run: sudo apt-get install --yes --no-install-recommends gcc-mingw-w64-x86-64-win32

      - name: Build
        run: cargo build --package gdpatch-loader --release --target ${{ matrix.target }}
      - name: Upload artifact
        uses: actions/upload-artifact@v7
        with:
          name: gdpatch-${{ matrix.target }}
          path: target/${{ matrix.target }}/release/${{ matrix.filename }}
